plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.example.app'
    compileSdk 34
    defaultConfig {
        applicationId "org.gradle.experimental.android.app"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
                appAuthRedirectHost: "org.gradle.experimental.android.app"
        ]
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                useJUnitPlatform()
                if (it.hasProperty("failOnNoDiscoveredTests")) {
                    it.setProperty("failOnNoDiscoveredTests", false)
                }
            }
        }
    }
    compileOptions {
        // Enable core library desugaring per AAR metadata requirement
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    buildTypes {
        release {
            // Keeping minify disabled for now; proguard rules are referenced for future enablement
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.apache.commons:commons-text:1.11.0"
    implementation project(":utilities")

    // TV / Leanback deps for Android TV
    implementation "androidx.leanback:leanback:1.2.0-alpha05"
    implementation "androidx.leanback:leanback-preference:1.2.0-alpha05"
    implementation "androidx.tvprovider:tvprovider:1.1.0-alpha01"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.fragment:fragment-ktx:1.8.3"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.webkit:webkit:1.10.0"

    // Required for core library desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // JUnit 5
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // AndroidX test (optional, keeps instrumentation runner happy)
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
