allprojects {
    // Marker for discovery tools; informs where the Android workspace lives
    ext.set("androidRootBridge", "content-rating-display-213568/vod_content_rating_frontend")
}
gradle.settingsEvaluated { settings ->
    if (settings.rootProject.name == null || settings.rootProject.name!!.isBlank()) {
        settings.rootProject.name = "workspace-root"
    }
}
